[project]
name = "ableton-mcp"
version = "0.1.0"
description = "MCP server for controlling Ableton Live via HTTP bridge"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["ableton", "live", "mcp", "midi", "music", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Repository = "https://github.com/rokbag/ableton-mcp"
Documentation = "https://github.com/rokbag/ableton-mcp/blob/main/docs/tool-usage-guide.md"

[project.scripts]
ableton-mcp = "ableton_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
    "anyio[trio]>=4.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
anyio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["control_surface/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
